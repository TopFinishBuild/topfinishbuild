<!doctype html>
<html lang="bg">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TopFinish Build – Довършителни Ремонти</title>
  <meta name="description"
    content="Топ Финиш Билд – Довършителни ремонти в София. Шпакловка, боядисване, теракота. 12+ години опит, 350+ завършени обекта." />

  <!-- Preload LCP hero image — browser fetches it immediately, before JS runs -->
  <link rel="preload" as="image" href="/hero.webp" type="image/webp" fetchpriority="high" />

  <!-- Fonts: non-blocking async load -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&family=Libre+Franklin:wght@700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&family=Libre+Franklin:wght@700&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- Critical CSS: above-fold only — identical to bundle CSS so React hydration is pixel-stable -->
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0}
    a{text-decoration:none}
    img{display:block}

    /* Header */
    header{background:#fff;border-bottom:1px solid #f1f5f9;box-shadow:0 1px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:40;isolation:isolate}
    header nav{max-width:80rem;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:4rem}
    .nav-desktop{display:none}
    .nav-mobile-btn{display:flex;background:none;border:none;color:#374151;padding:.25rem;cursor:pointer}
    @media(min-width:1024px){.nav-desktop{display:flex;align-items:center;gap:2rem}.nav-mobile-btn{display:none}}
    .nav-link{font-size:.9375rem;font-weight:500;color:#374151;text-decoration:none;position:relative;padding-bottom:2px}

    /* Buttons */
    .btn-primary{display:inline-flex;align-items:center;background:#f97316;color:#fff;font-size:1rem;font-weight:600;padding:.875rem 2rem;border-radius:.5rem;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(249,115,22,.35);text-decoration:none;white-space:nowrap}
    .btn-ghost{display:inline-flex;align-items:center;background:rgba(255,255,255,.1);color:#fff;font-size:1rem;font-weight:600;padding:.875rem 2rem;border-radius:.5rem;border:2px solid rgba(255,255,255,.35);cursor:pointer;text-decoration:none;white-space:nowrap}

    /* Hero */
    .hero-section{position:relative;overflow:hidden;background:#1e3a8a;min-height:60vh;display:flex;align-items:center}
    .hero-bg-img{position:absolute;inset:0;opacity:.88}
    .hero-bg-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center}
    .hero-overlay{position:absolute;inset:0}
    .app-root .hero-overlay{background:linear-gradient(90deg,rgb(1,15,56),rgba(2,17,58,.81) 53.78%,rgba(30,58,138,.82) 100%)}
    .hero-glows{position:absolute;inset:0;opacity:.12;pointer-events:none}
    .hero-glow-orange{position:absolute;top:2rem;right:2rem;width:24rem;height:24rem;background:#f97316;border-radius:50%;filter:blur(80px)}
    .hero-glow-blue{position:absolute;bottom:2rem;left:2rem;width:24rem;height:24rem;background:#3b82f6;border-radius:50%;filter:blur(80px)}
    .hero-content{width:100%;max-width:55rem;padding:6rem 3rem;position:relative;z-index:1;text-align:left}
    .app-root .hero-content{max-width:1280px;margin:0 auto;width:100%;padding:6rem 48px}
    @media(max-width:768px){.app-root .hero-content{padding:4rem 20px}}
    .hero-badge{background:rgba(249,115,22,.18);border:1px solid rgba(249,115,22,.35);border-radius:999px;padding:.4rem 1.1rem;font-size:.8125rem;font-weight:600;color:#fed7aa;letter-spacing:.08em;text-transform:uppercase;display:inline-block}
    .hero-title{font-size:clamp(2rem,7vw,4.5rem);font-weight:700;color:#fff;line-height:1;margin:1rem 0 1.25rem;letter-spacing:-.01em;max-width:30ch}
    .hero-subtitle{font-size:clamp(1rem,2.5vw,1.25rem);color:#bfdbfe;max-width:42rem;margin-bottom:2.5rem;line-height:1.7}
    .hero-buttons{display:flex;gap:1rem;flex-wrap:wrap}

    /* StatsBar */
    .stats-bar{position:relative;z-index:10;background:#f97316;padding:20px 48px}
    @media(max-width:768px){.stats-bar{padding:20px}}
    .stats-bar__grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(180px,320px));gap:0;justify-content:center}
    @media(max-width:640px){.stats-bar__grid{grid-template-columns:repeat(3,1fr);gap:8px}}
    .stats-bar__item{text-align:center;padding:8px 0;border-right:1px solid rgba(255,255,255,.3)}
    .stats-bar__item:last-child{border-right:none}
    .stats-bar__number{font-size:40px;font-weight:900;color:#fff;line-height:1}
    .stats-bar__label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-top:4px}
  </style>
</head>

<body>
  <div id="root"><div class="app-root"><header><nav><div><img src="/logos/topfinish-build-logo.png" alt="TopFinish Build" style="height:3rem;width:auto" /></div><div class="nav-desktop"><a href="#services" class="nav-link">Услуги</a><a href="#before-after" class="nav-link">Преди/След</a><a href="#gallery" class="nav-link">Галерия</a><a href="#calendar" class="nav-link">Календар</a><a href="#partners" class="nav-link">Партньори</a><a href="#prices" class="nav-link">Цени</a><a href="#about" class="nav-link">За нас</a><a href="#contact" class="btn-primary" style="padding:.6rem 1.5rem;font-size:.9375rem">Контакт</a></div><button class="nav-mobile-btn" aria-label="Отвори менюто"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button></nav></header><section class="hero-section"><div class="hero-bg-img"><img src="/hero.webp" alt="" fetchpriority="high" decoding="async" /></div><div class="hero-overlay"></div><div class="hero-glows"><div class="hero-glow-orange"></div><div class="hero-glow-blue"></div></div><div class="hero-content"><div style="margin-bottom:1.5rem"><span class="hero-badge">Професионални Довършителни Работи</span></div><h1 class="hero-title">TopFinish Build<br /><span style="color:#f97316">Правилният избор</span></h1><p class="hero-subtitle">Перфекционизъм във всеки детайл</p><div class="hero-buttons"><a href="#calendar" class="btn-primary">Свържете се с нас</a><a href="#before-after" class="btn-ghost">Вижте Резултатите</a></div></div></section><div class="stats-bar"><div class="stats-bar__grid"><div class="stats-bar__item"><div class="stats-bar__number">0+</div><div class="stats-bar__label">Завършени обекта</div></div><div class="stats-bar__item"><div class="stats-bar__number">0</div><div class="stats-bar__label">Години опит</div></div><div class="stats-bar__item"><div class="stats-bar__number">0%</div><div class="stats-bar__label">Доволни клиенти</div></div></div></div></div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
