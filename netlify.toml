[build]
  base = ""
  publish = "dist"
  command = "npm run build && cd server && npm install"
  functions = "server/functions"

[build.environment]
  # Production build; NPM_FLAGS keeps devDependencies (vite, plugins) installed,
  # which is the only reason NODE_ENV was set to "development" here before.
  NODE_ENV = "production"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# .com stays live and serves the same build. Both domains are then duplicate content,
# so the consolidation happens in the page instead: every route emits
# <link rel="canonical"> and og:url on .bg (src/utils/seo.ts).
# Sitemap is generated from the DB (server/functions/sitemap.ts) so every gallery
# photo gets a URL. force = true: no static file may shadow it.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/app/sitemap.xml"
  status = 200
  force = true

# API routes -> Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
